[project]
name = "orbit"
version = "0.1.0"
description = "ORBIT - Commando IA Evenementiel - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "playwright-stealth>=2.0.3",
    # ── Nouveaux providers LLM ──
    "openai>=1.40",          # client xAI (GROK) via compatibilité OpenAI
    "groq>=0.9",             # client Groq (Llama 3.3)
    "mistralai>=1.0",        # client Mistral (Judge)
    # ── Auth ──
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7",          # utilisé uniquement pour les utilitaires non-bcrypt
    "bcrypt>=4.0",           # appelé directement — contourne l'incompatibilité passlib/bcrypt 4.x
    "python-multipart>=0.0.9",

    # ── SSE ──
    "sse-starlette>=2.1",
    # ── Redis async ──
    "redis>=5.0",
    # ── PDF ──
    "reportlab>=4.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "playwright: necessite les binaires Playwright installes (playwright install chromium)",
]